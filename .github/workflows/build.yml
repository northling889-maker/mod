name: Build BETier Mod
# 触发条件：推送代码、PR时自动构建
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许手动点击按钮运行（重点！手机随时手动打包）
  workflow_dispatch:

jobs:
  build-mod:
    runs-on: ubuntu-24.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 校验Gradle包装文件
        uses: gradle/actions/wrapper-validation@v4

      - name: 配置JDK21（MC1.21+必须Java21）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft

      - name: 赋予gradlew执行权限
        run: chmod +x ./gradlew

      - name: 执行构建
        run: ./gradlew clean build

      - name: 上传成品mod（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: BETier-Mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

